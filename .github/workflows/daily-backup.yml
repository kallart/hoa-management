name: Automated Daily Supabase Backup to GitHub

# [PAUSED / DISABLED] ปิดการทำงานอัตโนมัติชั่วคราว
# เพื่อหยุดการแจ้งเตือน Error ทุกวัน หากต้องการเปิดใช้งานใหม่ให้เอา # ออกจาก schedule

on:
  workflow_dispatch: # อนุญาตให้กดทดสอบแบบ Manual ได้เท่านั้น
  # schedule:
  #   # Run daily at 17:00 UTC (00:00 Thailand Time)
  #   - cron: '0 17 * * *'

jobs:
  backup:
    runs-on: ubuntu-latest
    if: false # ป้องกันไม่ให้รันงานโดยไม่ตั้งใจ
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci
          npx prisma generate

      - name: Run Database Export Script
        run: |
          node frontend/export_backup.cjs

      - name: Commit and Push Backup to GitHub
        run: |
          git config --global user.name "GitHub Action Automation"
          git config --global user.email "action@github.com"
          git add backups/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated daily database backup [skip ci]" && git push)
